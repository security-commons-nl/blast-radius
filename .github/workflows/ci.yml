name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Het token van deze workflow mag alleen lezen. Dat is nu ook de standaard van de
# organisatie, maar expliciet blijft het staan als die standaard ooit verandert.
permissions:
  contents: read

jobs:
  # Tests via de herbruikbare workflow in security-commons-nl/.github.
  tests:
    uses: security-commons-nl/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      # python -m pytest zet de projectroot in sys.path, zodat het eigen
      # pakket importeerbaar is zonder installatie.
      test-command: "python -m pytest tests/ -v"
